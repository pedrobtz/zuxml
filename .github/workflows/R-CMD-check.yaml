# R CMD check, on the GitHub runners and in the CRAN-like containers.
# The reusable workflow carries the reasoning; this file carries only what is
# specific to this package.
#
# The container half is the reason for the switch. This package compiles a
# vendored copy of Expat, and CRAN's Debian clang leg -- clang 23 building C
# as -std=gnu23 -- is a configuration no GitHub runner has: ubuntu-latest's
# clang still defaults to __STDC_VERSION__ 201710L and its GCC is several
# majors behind. A diagnostic that exists only in the newer compiler, or only
# under -pedantic, otherwise stays invisible until CRAN's incoming pretest
# reports it, which is a rejected submission rather than a red check. Upstream
# C is written against the compilers upstream tests on, so that gap arrives
# here as someone else's warnings in our check log.
#
# No build-args, unlike the template: --compact-vignettes=gs+qpdf is for
# packages that ship vignette PDFs, and both vignettes here are html_vignette.
#
# No paths-ignore, unlike native-checks.yaml: --as-cran checks the URLs in
# README.md, which ships in the tarball, so a prose-only change is a real
# change here.
#
# Two things the previous matrix had that the reusable workflow's defaults do
# not, both dropped on purpose:
#
#   - the {ubuntu-latest, r: devel} row. The containers job is R-devel on
#     Linux already, on the compilers CRAN actually uses, where that row was
#     R-devel on the runner's own GCC and matched no CRAN flavor. Checked
#     against a real run: all three container legs reported R Under
#     development (unstable) 2026-09-15/16. Add `runners:` back if the images
#     ever go stale enough that a plain R-devel leg is worth the minutes.
#
#   - upload-snapshots: true. The package has no testthat snapshot tests and
#     no tests/testthat/_snaps directory, so it uploaded nothing. Worth
#     restoring the day a snapshot test is added, because a snapshot failure
#     is close to unreadable without the artifact.
on:
  push:
    branches: [main, master, develop]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
